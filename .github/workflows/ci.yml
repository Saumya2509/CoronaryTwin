# Runs on every push and pull request: registry consistency, Python tests, web tests and build,
# and both Docker images. Trained weights are committed, so no training runs in CI.
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch dataset and rebuild processed data
        run: python -m src.data
      - name: Registry consistency
        run: python scripts/check_registries.py
      - name: Tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the running stack
        run: |
          docker compose up -d
          for i in $(seq 1 40); do curl -fs localhost:8080/api/health && break; sleep 3; done
          curl -fs -X POST localhost:8080/api/predict -H 'Content-Type: application/json' -d '{"demo":"high"}' | grep -q '"vessels"'
          curl -fs localhost:8080/ | grep -q 'CoronaryTwin'
          curl -fs -X POST localhost:8080/api/next-best-test -H 'Content-Type: application/json' -d '{"demo":"mixed"}' | grep -q '"caption"'
          curl -fs localhost:8080/api/experiments | grep -q '"robustness"'
          curl -fs localhost:8080/api/experiments | grep -q '"baselines"'
          curl -fs -X POST localhost:8080/api/predict -H 'Content-Type: application/json' -d '{"demo":"high"}' | grep -q '"guideline"'
          curl -fs -X POST localhost:8080/api/extract -F files=@samples/reports/ecg_report.png | grep -q '"st_depression"'
          curl -fs localhost:8080/api/demo-set | grep -q '"High risk"'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end browser test (judge path)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npm run e2e
      - name: Single-container image (one-service hosting)
        run: |
          docker build -f Dockerfile.single -t coronarytwin-single .
          docker run -d -p 7860:7860 --name single coronarytwin-single
          for i in $(seq 1 40); do curl -fs localhost:7860/api/health && break; sleep 3; done
          curl -fs localhost:7860/ | grep -q 'CoronaryTwin'
      - if: always()
        run: docker compose logs && docker compose down
