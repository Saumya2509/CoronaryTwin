# One command: docker compose up --build   ->  http://localhost:8080
# Ports are configurable if they are taken: WEB_PORT=8081 API_PORT=8010 docker compose up
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"   # optional: direct API access and /docs
    volumes:
      - db-data:/srv/data          # SQLite: reference data + privacy-safe prediction log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s            # models and SHAP explainers load at startup
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
